<title>Escritorio de Versalles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Concepto: el escritorio de un cortesano en 1722 — boiserie gris verdosa, tinta azul real, filetes dorados; sello de lacre solo para lo urgente. */
:root{
  --paper:#eceee8; --panel:#f7f7f3; --ink:#1c2333; --muted:#5b6270; --line:#c8cabf;
  --gilt:#8d6a22; --accent:#2b3d78; --seal:#8a2e2e; --chip:#e1e4dc;
  --f-display:"IM Fell French Canon","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"EB Garamond",Garamond,"Times New Roman",serif;
  --r:4px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10141c; --panel:#171c27; --ink:#e7e3d7; --muted:#9ba1ad; --line:#2c3342;
  --gilt:#c9a24f; --accent:#93a8e2; --seal:#d4705f; --chip:#222a38; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10141c; --panel:#171c27; --ink:#e7e3d7; --muted:#9ba1ad; --line:#2c3342;
  --gilt:#c9a24f; --accent:#93a8e2; --seal:#d4705f; --chip:#222a38; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:17px/1.45 var(--f-body);padding-inline:16px;padding-block:0 84px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h2{font-size:1.35rem}
.label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin-inline:auto}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.tag.ej{border-color:var(--gilt);color:var(--gilt)}
.btn{border:1px solid var(--ink);background:transparent;padding:.45rem 1rem;border-radius:var(--r)}
.btn.primary{background:var(--ink);color:var(--paper)}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gilt),transparent);margin-block:4px}

/* ---------- Selector ---------- */
#selector{max-width:860px;margin-inline:auto;padding-block:28px 40px;display:grid;gap:22px}
.sel-head{text-align:center;display:grid;gap:6px}
.sel-head h1{font-size:clamp(2rem,6vw,3.2rem)}
.sel-head p{margin:0;color:var(--muted);font-style:italic}
.sel-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
.field{display:grid;gap:4px;min-width:0}
.field select,.field input{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:.45rem .6rem;width:100%}
.hint{font-size:.85rem;color:var(--muted);font-style:italic;min-height:1.2em}
.ejes{display:grid;gap:10px}
.eje{display:grid;grid-template-columns:7.5rem 1fr;gap:10px;align-items:center}
.seg{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:var(--panel);padding:.35rem .2rem;font-size:.85rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sel-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- Escritorio ---------- */
#desk{padding-block:10px 20px;display:grid;gap:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:grid;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.bar-top{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
.who{font-family:var(--f-display);font-size:1.3rem}
.who small{font-family:var(--f-body);font-size:.9rem;color:var(--muted);font-style:italic}
.date{font-style:italic;color:var(--muted)}
.clock{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.clock span{flex:0 0 auto;font-size:.8rem;padding:2px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.clock span.now{border-color:var(--gilt);color:var(--ink);background:var(--chip)}
.gauges{display:flex;flex-wrap:wrap;gap:4px 16px}
.gauge{display:flex;align-items:center;gap:6px;font-size:.85rem}
.pips{display:inline-flex;gap:2px}
.pips i{width:7px;height:7px;border:1px solid var(--gilt);border-radius:50%}
.pips i.on{background:var(--gilt)}
.gauge.alert .pips i{border-color:var(--seal)} .gauge.alert .pips i.on{background:var(--seal)}

.desk-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.pane-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:.3rem .7rem;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gilt)}
.side{display:grid;gap:14px;align-content:start;min-width:0}

/* Mapa */
.map-box{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.map-box svg{display:block;width:100%;height:auto}
.zone{fill:var(--chip);stroke:var(--muted);stroke-width:1;cursor:pointer;transition:fill .15s}
.zone:hover,.zone:focus{fill:var(--line);outline:none}
.zone.sel{fill:var(--gilt);fill-opacity:.35;stroke:var(--gilt);stroke-width:1.6}
.zone.open{fill:transparent;stroke-dasharray:3 3}
.zone.water{fill:var(--accent);fill-opacity:.18}
.zone.green{fill:var(--gilt);fill-opacity:.08}
.mlabel{font:12px var(--f-body);fill:var(--ink);pointer-events:none}
.mlabel.s{font-size:10px;fill:var(--muted)}
.compass{font:11px var(--f-display);fill:var(--muted)}
.city{fill:var(--ink);cursor:pointer} .city.sel{fill:var(--gilt)}
.coast{fill:var(--chip);stroke:var(--muted);stroke-width:1}
.map-info{display:grid;gap:4px;min-height:5.5rem}
.map-info h3{font-size:1.15rem}
.map-info p{margin:0}
.note{font-size:.82rem;color:var(--muted);font-style:italic}

/* Papeles */
.paper{border-left:2px solid var(--line);padding:4px 0 4px 10px;display:grid;gap:2px}
.paper.urg{border-left-color:var(--seal)}
.paper b{font-weight:600}
.paper .from{font-size:.85rem;color:var(--muted)}
.paper p{margin:0;font-size:.95rem}
.list{display:grid;gap:10px}
.obj{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding-block:6px;border-bottom:1px solid var(--line)}
.obj:last-child{border-bottom:0}
.obj .d{grid-column:1/-1;font-size:.88rem;color:var(--muted)}

/* Libro de caras */
.faces-tools{display:flex;gap:8px;flex-wrap:wrap}
.faces-tools input,.faces-tools select{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:.35rem .6rem;min-width:0}
.faces-tools input{flex:1 1 14rem}
.rama{display:grid;gap:8px}
.rama h3{font-size:1.05rem;color:var(--gilt)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.card{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.card:hover{border-color:var(--gilt)}
.card.away{opacity:.55}
.medal{width:44px;height:44px;border-radius:50%;border:1px solid var(--gilt);display:grid;place-items:center;font-family:var(--f-display);font-size:1.05rem;color:var(--gilt)}
.card b{display:block;font-weight:500;line-height:1.2}
.card span{font-size:.82rem;color:var(--muted);display:block;line-height:1.25}

/* Ficha */
#ficha{position:fixed;inset:0 0 0 auto;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:20;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start;box-shadow:-8px 0 24px rgb(0 0 0 / .18)}
#ficha dl{display:grid;grid-template-columns:8.5rem 1fr;gap:6px 10px;margin:0}
#ficha dt{color:var(--muted);font-size:.85rem}
#ficha dd{margin:0}
#ficha textarea{width:100%;min-height:7rem;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:.5rem}
.x{justify-self:end;border:0;background:none;font-size:1.6rem;line-height:1}

/* Navegación móvil */
.mnav{display:none}
@media (max-width:860px){
  body{font-size:16px}
  .sel-grid{grid-template-columns:1fr}
  .eje{grid-template-columns:1fr}
  .desk-grid{grid-template-columns:1fr}
  #desk [data-pane]{display:none}
  #desk [data-pane].show{display:grid}
  .side{display:contents}
  .mnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .mnav button{border:0;background:none;padding:.7rem .2rem;color:var(--muted);font-size:.9rem}
  .mnav button[aria-current="true"]{color:var(--ink);box-shadow:inset 0 2px 0 var(--gilt)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!-- ================= SELECTOR ================= -->
<main id="selector" class="wrap" hidden>
  <header class="sel-head">
    <span class="label">Versalles · junio de 1722</span>
    <h1>Lettre d’introduction</h1>
    <p>La corte vuelve a Versalles tras siete años en París. ¿Quién eres al cruzar el Patio Real?</p>
    <div class="rule"></div>
  </header>
  <div class="sel-grid">
    <div class="field"><label class="label" for="f-nombre">Nombre</label><input id="f-nombre" autocomplete="off"></div>
    <div class="field"><label class="label" for="f-pos">Posición</label><select id="f-pos"></select><div class="hint" id="h-pos"></div></div>
    <div class="field"><label class="label" for="f-origen">Origen</label><select id="f-origen"></select></div>
    <div class="field"><label class="label" for="f-edu">Educación</label><select id="f-edu"></select></div>
  </div>
  <div class="sel-actions">
    <button class="btn primary" id="b-entrar">Entrar en Versalles</button>
  </div>
</main>

<!-- ================= ESCRITORIO ================= -->
<div id="desk" class="wrap" hidden>
  <header class="bar">
    <div class="bar-top">
      <div class="who" id="who"></div>
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <span class="date" id="fecha"></span>
        <button class="btn" id="b-perso" style="padding:.15rem .6rem;font-size:.85rem">Cambiar personaje</button>
      </div>
    </div>
    <div class="clock" id="clock" aria-label="Jornada del rey"></div>
    <div class="gauges" id="gauges"></div>
  </header>

  <div class="desk-grid">
    <section class="pane show" data-pane="mapa" aria-label="Mapa">
      <div class="pane-h"><h2>Mapa</h2><span class="note">Planos esquemáticos, no a escala</span></div>
      <div class="tabs" role="tablist" id="map-tabs">
        <button role="tab" data-map="palacio" aria-selected="true">Palacio</button>
        <button role="tab" data-map="dominio" aria-selected="false">Dominio</button>
        <button role="tab" data-map="francia" aria-selected="false">Francia</button>
      </div>
      <div class="map-box" id="map-box"></div>
      <div class="map-info" id="map-info"></div>
    </section>

    <div class="side">
      <section class="pane" data-pane="papeles" aria-label="Papeles">
        <div class="pane-h"><h2>Papeles</h2><span class="tag ej">Ejemplo</span></div>
        <div class="tabs" role="tablist" id="pap-tabs">
          <button role="tab" data-p="carta" aria-selected="true">Cartas</button>
          <button role="tab" data-p="rumor" aria-selected="false">Rumores</button>
          <button role="tab" data-p="oblig" aria-selected="false">Obligaciones</button>
        </div>
        <div class="list" id="papeles"></div>
      </section>
      <section class="pane" data-pane="papeles" aria-label="Objetos">
        <div class="pane-h"><h2>Objetos</h2><span class="tag ej">Ejemplo</span></div>
        <div id="objetos"></div>
      </section>
    </div>
  </div>

  <section class="pane" data-pane="caras" aria-label="Libro de caras">
    <div class="pane-h"><h2>Libro de caras</h2><span class="note" id="faces-count"></span></div>
    <div class="faces-tools">
      <input id="q" type="search" placeholder="Buscar por nombre o título" aria-label="Buscar">
      <select id="f-pres" aria-label="Presencia">
        <option value="">Toda presencia</option>
        <option value="reside">Reside en el palacio</option>
        <option value="frecuenta">Frecuenta la corte</option>
        <option value="ocasional">Visitas ocasionales</option>
        <option value="ausente">Fuera de Versalles</option>
      </select>
    </div>
    <div id="faces" class="list"></div>
  </section>
</div>

<aside id="ficha" hidden aria-label="Ficha"></aside>

<nav class="mnav" id="mnav" hidden>
  <button data-go="mapa" aria-current="true">Mapa</button>
  <button data-go="caras">Caras</button>
  <button data-go="papeles">Papeles</button>
  <button data-go="yo">Yo</button>
</nav>

function drawRooms(svg,rooms,vb){

    svg.append(rect);
    if(w>40||h>40){const t=sv("text",{x:x+w/2,y:y+h/2+4,"text-anchor":"middle",class:"mlabel"+(w<60?" s":"")},n.split(" (")[0]);if(h>w*1.6&&w<50){t.setAttribute("transform",`rotate(-90 ${x+w/2} ${y+h/2})`)}svg.append(t)}

  } else {
    svg.setAttribute("aria-label","Mapa aproximado de Francia");
    const W=600,H=520, lon0=-5.2,lon1=8.6,lat0=42.2,lat1=51.3, k=Math.cos(46.5*Math.PI/180);
    const sx=W/((lon1-lon0)*k), sy=H/(lat1-lat0), s=Math.min(sx,sy);
    const P=([lo,la])=>[((lo-lon0)*k*s).toFixed(1),((lat1-la)*s).toFixed(1)];
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
    svg.append(sv("polygon",{points:CONTORNO.map(p=>P(p).join(",")).join(" "),class:"coast"}));
    CIUDADES.forEach(c=>{
      const [x,y]=P(c); const dot=sv("circle",{cx:x,cy:y,r:5,class:"city",tabindex:0,role:"button","aria-label":c[2]});
      const pick=()=>{svg.querySelectorAll(".city").forEach(z=>z.classList.remove("sel"));dot.classList.add("sel");mapInfo(c[2]+" · "+c[3],c[4],el("div",{class:"note"},"Sin noticias de esta provincia todavía."))};
      dot.addEventListener("click",pick);dot.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick()}});
      svg.append(dot, sv("text",{x:+x+8,y:+y+4,class:"mlabel s"},c[2]));
    });
    const [vx,vy]=P([2.13,48.80]); svg.append(sv("circle",{cx:vx,cy:vy,r:3.5,fill:"var(--gilt)"}));
    mapInfo("Reino de Francia","Contorno aproximado de 1722 (incluye la Lorena, que aún no era francesa). Toca una ciudad para ver su provincia.");
  }
  box.append(svg);
}

/* ---------- Libro de caras ---------- */
const PRES={reside:"Reside en el palacio",frecuenta:"Frecuenta la corte",ocasional:"Visitas ocasionales",ausente:"Fuera de Versalles","por verificar":"Presencia sin confirmar"};
function initials(n){return n.replace(/\b(de|del|la|II)\b/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("")}
function drawFaces(){
  const q=$("#q").value.trim().toLowerCase(), fp=$("#f-pres").value;
  const list=PERSONAJES.filter(p=>(!fp||p.presencia_versalles===fp)&&(!q||(p.nombre+" "+p.titulo).toLowerCase().includes(q)));
  $("#faces-count").textContent=list.length+" de "+PERSONAJES.length+" personas";
  const b=$("#faces"); b.innerHTML="";
  const ramas={}; list.forEach(p=>(ramas[p.rama.split(" / ")[0]] ||= []).push(p));
  for(const [r,ps] of Object.entries(ramas)){
    const cards=el("div",{class:"cards"});
    ps.forEach(p=>cards.append(el("button",{class:"card"+(p.presencia_versalles==="ausente"?" away":""),onclick:()=>openFicha(p)},el("span",{class:"medal","aria-hidden":"true"},initials(p.nombre)),el("span",{},el("b",{},p.nombre),el("span",{},p.titulo),el("span",{},p.edad_jun_1722+" años")))));
    b.append(el("div",{class:"rama"},el("h3",{},"Casa de "+r.replace("Real","Francia")),cards));
  }
  if(!list.length)b.append(el("p",{class:"note"},"Nadie coincide con la búsqueda."));
}
function openFicha(p){
  const f=$("#ficha"); f.innerHTML="";
  const notas=store.get("vg_notas",{});
  const ta=el("textarea",{id:"nota-"+p.id,placeholder:"Lo que piensas de esta persona. Solo tú lo ves."}); ta.value=notas[p.id]||"";
  ta.addEventListener("input",()=>{const n=store.get("vg_notas",{});n[p.id]=ta.value;store.set("vg_notas",n)});
  const dl=el("dl",{});
  [["Título",p.titulo],["Edad",p.edad_jun_1722+" años (n. "+p.nacimiento.split("-").reverse().join("/")+")"],["Parentesco",p.parentesco],["Situación",p.situacion_1722||"—"],["Presencia",PRES[p.presencia_versalles]],["Notas",p.notas||"—"]].forEach(([k,v])=>dl.append(el("dt",{},k),el("dd",{},v)));
  f.append(el("button",{class:"x","aria-label":"Cerrar",onclick:()=>{f.hidden=true}},"×"),
    el("span",{class:"label"},"Libro de caras"),el("h2",{},p.nombre),el("div",{class:"rule"}),dl,
    el("span",{class:"label"},"Lo que sabes"),el("p",{class:"note",style:"margin:0"},"Todavía no has observado nada de esta persona."),
    el("label",{class:"label",for:"nota-"+p.id},"Tus notas"),ta,
    el("span",{class:p.verificacion==="verificado"?"tag":"tag ej"},p.verificacion==="verificado"?"Datos verificados":"Datos por verificar"));
  f.hidden=false; f.querySelector(".x").focus();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#ficha").hidden=true});

/* ---------- Navegación ---------- */
function show(v){
  $("#selector").hidden=v!=="selector"; $("#desk").hidden=v!=="desk"; $("#mnav").hidden=v!=="desk";
  if(v==="desk"){buildBar();drawMap("palacio");drawPapeles();drawObjetos();drawFaces()} else buildSelector();
  window.scrollTo(0,0);
}
$("#map-tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;[...e.currentTarget.children].forEach(x=>x.setAttribute("aria-selected",String(x===b)));drawMap(b.dataset.map)});
$("#pap-tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;[...e.currentTarget.children].forEach(x=>x.setAttribute("aria-selected",String(x===b)));papTab=b.dataset.p;drawPapeles()});
$("#q").addEventListener("input",drawFaces); $("#f-pres").addEventListener("change",drawFaces);
$("#b-perso").onclick=()=>show("selector");
$("#mnav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.go==="yo"){show("selector");return}
  [...e.currentTarget.children].forEach(x=>x.setAttribute("aria-current",String(x===b)));
  document.querySelectorAll("#desk [data-pane]").forEach(p=>p.classList.toggle("show",p.dataset.pane===b.dataset.go));window.scrollTo(0,0)});

show(player ? "desk" : "selector");
