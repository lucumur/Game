<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="230" viewBox="0 0 200 230" role="img">
<title>Blason de l'évêché et de la principauté épiscopale de Metz</title>
