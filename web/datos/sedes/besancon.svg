  <polygon points="111,192 175,192 178,197 108,197" fill="#e6cf3a"/>
  <polygon points="116,187 170,187 174,192 112,192" fill="#f6e34f"/>
  <rect x="120" y="160" width="46" height="27" fill="#f6e34f"/>
  <rect x="126" y="165" width="34" height="17" fill="#e6cf3a"/>
  <polygon points="113,154 173,154 167,160 119,160" fill="#f6e34f"/>
