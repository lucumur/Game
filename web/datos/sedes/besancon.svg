  <rect x="123" y="94" width="38" height="11" fill="#e6cf3a"/>
  <path d="M124 99.5L129 94.5L135 104.5L142 94.5L149 104.5L155 94.5L160 99.5L155 104.5L149 94.5L142 104.5L135 94.5L129 104.5Z" fill="none" stroke="#141414" stroke-width="1"/>
  <circle cx="132" cy="99.5" r="2.2" fill="none" stroke="#141414" stroke-width="0.95"/>
  <circle cx="142" cy="99.5" r="2.2" fill="none" stroke="#141414" stroke-width="0.95"/>
  <circle cx="152" cy="99.5" r="2.2" fill="none" stroke="#141414" stroke-width="0.95"/>
  <!-- Muñeca y mano derecha bendiciendo -->
  <path d="M130 94V82C123 78 119 71 119 63C119 56 125 53 130 56V32C130 27 137 27 137 32V52C138 27 146 27 146 32V56C149 56 151 58 151 62L157 52C160 47 166 50 163 56L154 75C153 81 151 86 150 94Z" fill="#f6e34f"/>
  <!-- Dedos doblados y pliegues de la palma -->
  <path d="M125 56C128 56 130 59 130 64C130 68 127 70 124 68C121 66 121 58 125 56Z" fill="#e6cf3a"/>
  <path d="M131 58C134 58 136 61 136 66C136 70 133 72 130 70C128 68 128 60 131 58Z" fill="#e6cf3a"/>
  <path d="M137 33V56M130 42H136M139 42H145M130 49H136M139 49H145M128 76C134 74 142 75 147 78M133 84C138 82 144 83 148 85" fill="none" stroke="#141414" stroke-width="1.1"/>
</g>
