<!-- Águila de San Juan (contornada, de oro, con filacteria de plata) -->
<g id="aigle-saint-jean" stroke="#141414" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round">
  <!-- Cola en abanico -->
  <path d="M44 134L22 162L29 166L47 141L36 167L43 169L54 143L48 168L55 168L63 142Z" fill="#e6cf3a"/>
  <!-- Cuerpo, cuello y cabeza mirando a la diestra del observador -->
  <path d="M56 64C62 56 69 49 69 43C66 43 65 40 68 38C64 38 64 34 70 33C75 30 84 29 90 33C95 36 96 39 95 40C91 39 87 39 84 41C89 41 93 43 95 45C91 46 86 45 81 44C82 47 84 52 80 56L84 58L77 61L82 65L75 68L82 74L77 77L86 83L80 86L88 94L84 98C88 106 87 118 80 128L66 138L52 135Z" fill="#f6e34f"/>
  <!-- Lengua y ojo -->
  <path d="M84 42C89 42 93 40 96 38" fill="none" stroke="#141414" stroke-width="1.2"/>
  <path d="M77 35C79 34 81 35 81 36.5C79 37 77 36.5 77 35Z" fill="#141414" stroke="none"/>
  <!-- Plumas del cuello y pecho -->
  <path d="M72 48L67 52M75 54L69 58M74 62L69 66M76 70L71 74M77 79L72 83" fill="none" stroke="#141414" stroke-width="1.1"/>
  <!-- Pata y garra delantera apoyada en la filacteria -->
  <path d="M76 105L93 105L98 109M93 105L95 113M86 112L91 118" fill="none" stroke="#141414" stroke-width="1.6"/>
  <!-- Ala derecha alzada con hileras de plumas -->
  <path d="M40 34C32 46 28 72 30 100C32 122 36 138 42 148L46 112L49 144L54 108L57 139L62 104L66 134L72 95C71 74 63 50 48 34C45 31 42 31 40 34Z" fill="#f6e34f"/>
  <path d="M44 37C39 48 36 68 37 92M49 42C45 55 43 76 44 98M55 49C52 63 51 82 52 101" fill="none" stroke="#141414" stroke-width="1.1"/>
  <path d="M36 68C42 74 52 76 62 72M34 86C42 92 54 93 66 88M34 103C42 108 54 109 67 104" fill="none" stroke="#141414" stroke-width="1.1"/>
  <!-- Garra trasera agarrando el rollo inferior -->
  <path d="M44 152L39 159L45 161M45 155L49 162" fill="none" stroke="#141414" stroke-width="1.5"/>
</g>

<!-- Filacteria de plata con SANCTUS IOANNES -->
<g id="phylactere">
  <path d="M43 176C41 171 45 166 51 168L54 171L103 100L100 96C98 92 103 87 108 90C114 93 118 99 113 105L64 176C66 181 62 187 55 186C49 185 45 181 43 176Z" fill="#f2f2ef" stroke="#141414" stroke-width="1.35" stroke-linejoin="round"/>
  <path d="M48 175C50 172 54 173 54 177C54 180 51 182 48 180" fill="#d8dadf" stroke="#141414" stroke-width="1.1"/>
  <path d="M107 95C109 93 113 95 112 98C111 101 108 101 106 99" fill="#d8dadf" stroke="#141414" stroke-width="1.1"/>
  <text x="0" y="0" transform="translate(57 177) rotate(-55.5)" font-family="Georgia, 'Times New Roman', serif" font-size="9.4" font-weight="700" letter-spacing="0.4" fill="#141414">SANCTUS IOANNES</text>
</g>

<!-- Antebrazo relicario de San Esteban sobre pedestal escalonado (de oro) -->
